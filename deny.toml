[graph]
targets = [{ triple = "x86_64-pc-windows-msvc" }]

[advisories]
version = 2
yanked = "deny"
ignore = [
  # The rust-unic crates are unmaintained with no upgrade path. They reach us
  # only through tauri-utils -> urlpattern, are compile-time/parsing helpers,
  # and the advisories are "unmaintained", not vulnerabilities. Revisit when
  # tauri drops urlpattern.
  "RUSTSEC-2025-0075", # unic-char-property
  "RUSTSEC-2025-0080", # unic-char-range
  "RUSTSEC-2025-0081", # unic-common
  "RUSTSEC-2025-0098", # unic-ucd-version
  "RUSTSEC-2025-0100", # unic-ucd-ident
  # `paste` is an unmaintained proc-macro helper reached through lofty. It
  # expands at compile time and ships no runtime code, and the advisory is
  # "unmaintained" rather than a vulnerability. Revisit when lofty drops it.
  "RUSTSEC-2024-0436", # paste
]

[licenses]
version = 2
# The crate is MIT (see LICENSE) and never published to crates.io. `private`
# stays on so an unpublished workspace member is not required to restate it.
private = { ignore = true }
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  # File-level copyleft, and the only entry here that asks anything of us.
  # Reaches the binary through symphonia - the mp3 decoder, so not optional -
  # and through cssparser/selectors under Tauri's webview layer. Combining it
  # with MIT code is explicitly permitted (MPL-2.0 section 3.3); what it
  # requires is that recipients be told where to get the source of the
  # MPL-covered files, which THIRD-PARTY-NOTICES.md does. Keep it that way if
  # this list ever grows an MPL crate we actually patch.
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
