name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint & format
        run: npm run lint
      - name: Unit & component tests
        run: npm run test:coverage

  rust:
    name: rust
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Generated bindings are up to date
        shell: bash
        run: |
          git diff --exit-code -- src/ipc/bindings \
            || (echo "::error::src/ipc/bindings is stale - run 'npm run bindings' and commit the result" && exit 1)

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories licenses sources bans

  e2e:
    name: e2e
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      # The runner's preinstalled msedgedriver is pinned to the Edge browser
      # version, which drifts from the evergreen WebView2 runtime the app
      # actually embeds. A mismatch surfaces as "DevToolsActivePort file
      # doesn't exist", so fetch the driver matching the installed runtime.
      - name: Install version-matched Edge WebDriver
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty $key).pv
          Write-Host "WebView2 runtime: $version"
          $dest = Join-Path $env:RUNNER_TEMP 'edgedriver'
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" `
            -OutFile "$env:RUNNER_TEMP\edgedriver.zip" -UseBasicParsing
          Expand-Archive "$env:RUNNER_TEMP\edgedriver.zip" -DestinationPath $dest -Force
          "MSEDGEDRIVER=$dest\msedgedriver.exe" | Out-File $env:GITHUB_ENV -Append
      - name: Build app (debug)
        run: npm run tauri -- build --debug --no-bundle
      - name: Run WebDriver smoke suite
        run: npm run e2e
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/screenshots
          if-no-files-found: ignore
