name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TAURI_DRIVER_VERSION: "2.0.6"

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint & format
        run: npm run lint
      - name: Unit & component tests
        run: npm run test:coverage

  rust:
    name: rust
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: rust-tests
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Generated bindings are up to date
        shell: bash
        run: |
          git diff --exit-code -- src/ipc/bindings \
            || (echo "::error::src/ipc/bindings is stale - run 'npm run bindings' and commit the result" && exit 1)

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories licenses sources bans

  e2e:
    name: e2e
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: e2e-build
          # `cargo install` builds in its own temp dir, so its dependency
          # sources are not part of the workspace cache without this.
          cache-all-crates: true
      - run: npm ci
      # rust-cache deliberately leaves ~/.cargo/bin alone, so the tauri-driver
      # build repeats on every run unless it is cached separately. Pinned so
      # the cache key changes only on a deliberate upgrade.
      - name: Cache tauri-driver
        id: tauri-driver-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver.exe
          key: tauri-driver-${{ runner.os }}-${{ env.TAURI_DRIVER_VERSION }}
      - name: Install tauri-driver
        if: steps.tauri-driver-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked --version ${{ env.TAURI_DRIVER_VERSION }}
      # The runner's preinstalled msedgedriver tracks the Edge browser version,
      # which drifts from the evergreen WebView2 runtime the app embeds; the
      # mismatch surfaces as "DevToolsActivePort file doesn't exist".
      # msedgedriver-tool is the tool Tauri's own WebDriver CI uses: it fetches
      # the matching driver into the working directory, which then goes on PATH
      # so tauri-driver discovers it without a --native-driver override.
      - name: Cache msedgedriver-tool
        id: msedgedriver-tool-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/msedgedriver-tool.exe
          key: msedgedriver-tool-${{ runner.os }}-v1
      - name: Install msedgedriver-tool
        if: steps.msedgedriver-tool-cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/chippers/msedgedriver-tool
      - name: Fetch matching Edge WebDriver
        run: |
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          $PWD.Path >> $env:GITHUB_PATH
      - name: Build app (debug)
        run: npm run tauri -- build --debug --no-bundle
      - name: Run WebDriver smoke suite
        run: npm run e2e
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/screenshots
          if-no-files-found: ignore
