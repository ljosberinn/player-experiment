name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint & format
        run: npm run lint
      - name: Unit & component tests
        run: npm run test:coverage
      # Runs here as well as inside `tauri build`, because a warning in the
      # e2e job's nine-minute log is a warning nobody reads. Warnings are
      # errors; see the onwarn handler in vite.config.ts.
      - name: Production build
        run: npm run build

  rust:
    name: rust
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: rust-tests
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Generated bindings are up to date
        shell: bash
        run: |
          git diff --exit-code -- src/ipc/bindings \
            || (echo "::error::src/ipc/bindings is stale - run 'npm run bindings' and commit the result" && exit 1)

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories licenses sources bans

  notices:
    # A notices file is only worth having if it describes the dependency set
    # that ships, so it gets the same drift check the generated bindings get.
    # Its own job rather than a step on `frontend`: it needs both toolchains,
    # and a stale notices file should not read as a failing test suite.
    name: notices
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: rust-tests
      - run: npm ci
      - name: Third-party notices are up to date
        run: npm run notices:check

  e2e:
    name: e2e
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: e2e-build
      - run: npm ci
      # @wdio/tauri-service's default `embedded` provider runs the WebDriver
      # server inside the app, so no tauri-driver or msedgedriver is needed.
      # The instrumentation is behind the `wdio` cargo feature and its
      # capability comes from a --config overlay, so a normal build ships
      # neither. That overlay also sets `withGlobalTauri`, which the service
      # needs on every command - see PLAN.md, "e2e wall time".
      - name: Build app (debug, e2e-instrumented)
        env:
          # Pulls @wdio/tauri-plugin into the bundle. Every other build leaves
          # that import in a dead branch, so it ships nowhere else.
          VITE_E2E: "true"
        run: npm run tauri -- build --debug --no-bundle --features wdio --config src-tauri/tauri.wdio.conf.json
      - name: Run WebDriver smoke suite
        run: npm run e2e
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: e2e/screenshots
          if-no-files-found: ignore
