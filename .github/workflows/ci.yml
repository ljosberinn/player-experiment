name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which of the jobs below actually have to do their work.
  #
  # Every job still runs and still reports, because a required status check
  # cannot be satisfied by a job that never ran - `paths-ignore` at the workflow
  # level would leave a documentation-only PR permanently unmergeable once the
  # checks are required. What gets skipped is the expensive *steps* inside each
  # job, so a prose change costs five runner startups instead of a full gate:
  # about 4 billed minutes rather than 17.
  #
  # It fails safe in the one direction that matters. Anything not recognised as
  # prose counts as code, an unreadable file list counts as code, and a push
  # counts as code. Only a changeset that is entirely documentation may skip.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull request - running everything."
            exit 0
          fi

          files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.number }}/files" --paginate --jq '.[].filename') || files=""

          if [ -z "$files" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Could not read the changed files - running everything."
            exit 0
          fi

          code=false
          while IFS= read -r file; do
            case "$file" in
              # A workflow change is code however it is spelled.
              .github/*) code=true ;;
              *.md|LICENSE) ;;
              *) code=true ;;
            esac
          done <<< "$files"

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Changed files:"
          echo "$files"
          echo "Full gate: $code"

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: needs.changes.outputs.code == 'true'
      - name: Typecheck
        if: needs.changes.outputs.code == 'true'
        run: npm run typecheck
      - name: Lint & format
        if: needs.changes.outputs.code == 'true'
        run: npm run lint
      - name: Unit & component tests
        if: needs.changes.outputs.code == 'true'
        run: npm run test:coverage
      # Runs here as well as inside `tauri build`, because a warning in the
      # e2e job's nine-minute log is a warning nobody reads. Warnings are
      # errors; see the onwarn handler in vite.config.ts.
      - name: Production build
        if: needs.changes.outputs.code == 'true'
        run: npm run build

  rust:
    name: rust
    runs-on: windows-latest
    needs: changes
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
        with:
          workspaces: src-tauri
          shared-key: rust-tests
      - name: Format
        if: needs.changes.outputs.code == 'true'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Clippy
        if: needs.changes.outputs.code == 'true'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        if: needs.changes.outputs.code == 'true'
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Generated bindings are up to date
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          git diff --exit-code -- src/ipc/bindings \
            || (echo "::error::src/ipc/bindings is stale - run 'npm run bindings' and commit the result" && exit 1)

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'
      - uses: EmbarkStudios/cargo-deny-action@v2
        if: needs.changes.outputs.code == 'true'
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories licenses sources bans

  notices:
    # The notices file is generated by `beforeBuildCommand` and never
    # committed, so there is no drift to check. What can still go wrong is the
    # generator: a dependency arriving with no licence file, or a tool failing
    # in a way that reads as "no dependencies" - and finding that out during a
    # release build is finding it out too late.
    #
    # So this job runs the generator and throws the result away. It cannot fail
    # merely because a dependency moved, which is what the drift check did on
    # every update Dependabot ever opened.
    #
    # Its own job rather than a step on `frontend`: it needs both toolchains.
    #
    # Linux, not Windows. It reads metadata and licence files - `cargo metadata`
    # compiles nothing and the npm side is a lockfile read - so the Windows
    # runner was buying a 2x multiplier and a 17-second checkout. The one
    # platform-sensitive part, `--filter-platform x86_64-pc-windows-msvc`, is a
    # filter over the resolve graph and does not need the target installed; the
    # generator normalises line endings, which is what makes the output
    # identical either way.
    name: notices
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
        with:
          workspaces: src-tauri
          # Its own key, and no target directory. This job never compiles, so
          # restoring the test job's build artifacts was ~27 seconds spent on
          # files it does not open. What it does want is the registry, so that
          # reading three hundred crate manifests is not three hundred
          # downloads.
          shared-key: notices-metadata
          cache-targets: false
      # Production dependencies only. The package list comes from the lockfile,
      # so dev packages contribute nothing but install time - and there are
      # roughly five hundred of them against twenty-one that ship.
      - run: npm ci --omit=dev
        if: needs.changes.outputs.code == 'true'
      - name: The third-party notices can still be generated
        if: needs.changes.outputs.code == 'true'
        run: npm run notices -- --force

  e2e:
    name: e2e
    runs-on: windows-latest
    needs: changes
    # Beyond the default read-only token: the screenshot step below pushes to a
    # branch of its own and rewrites this pull request's body.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.code == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
        with:
          workspaces: src-tauri
          shared-key: e2e-build
      - run: npm ci
        if: needs.changes.outputs.code == 'true'
      # @wdio/tauri-service's default `embedded` provider runs the WebDriver
      # server inside the app, so no tauri-driver or msedgedriver is needed.
      # The instrumentation is behind the `wdio` cargo feature and its
      # capability comes from a --config overlay, so a normal build ships
      # neither. That overlay also sets `withGlobalTauri`, which the service
      # needs on every command - see docs/knowledge/gotchas.md, "Toolchain".
      - name: Build app (debug, e2e-instrumented)
        if: needs.changes.outputs.code == 'true'
        env:
          # Pulls @wdio/tauri-plugin into the bundle. Every other build leaves
          # that import in a dead branch, so it ships nowhere else.
          VITE_E2E: "true"
        run: npm run tauri -- build --debug --no-bundle --features wdio --config src-tauri/tauri.wdio.conf.json
      # The runner boots at 1024x768, which caps how large the app window can
      # be and so caps the screenshots the suite takes for the pull request
      # body. There is no cmdlet for this on the runner image, so it is a
      # P/Invoke to ChangeDisplaySettings.
      #
      # `continue-on-error`, and the script swallows its own failures: the
      # screenshots are a review aid. A runner that refuses to resize should
      # produce smaller pictures, not a red build. `viewport.ts` reports the
      # size it actually reached.
      - name: Give the runner a desktop-sized display
        if: needs.changes.outputs.code == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          $source = @'
          using System;
          using System.Runtime.InteropServices;
          public class Display {
            [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Ansi)]
            public struct DEVMODE {
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;
              public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra;
              public int dmFields;
              public int dmPositionX, dmPositionY, dmDisplayOrientation, dmDisplayFixedOutput;
              public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;
              public short dmLogPixels;
              public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency;
              public int dmICMMethod, dmICMIntent, dmMediaType, dmDitherType, dmReserved1, dmReserved2, dmPanningWidth, dmPanningHeight;
            }
            [DllImport("user32.dll")] public static extern int EnumDisplaySettings(string device, int mode, ref DEVMODE dm);
            [DllImport("user32.dll")] public static extern int ChangeDisplaySettings(ref DEVMODE dm, int flags);
            public static int Set(int width, int height) {
              DEVMODE dm = new DEVMODE();
              dm.dmDeviceName = new string(new char[32]);
              dm.dmFormName = new string(new char[32]);
              dm.dmSize = (short)Marshal.SizeOf(typeof(DEVMODE));
              if (EnumDisplaySettings(null, -1, ref dm) == 0) { return -1; }
              dm.dmPelsWidth = width;
              dm.dmPelsHeight = height;
              dm.dmFields = 0x80000 | 0x100000;   // DM_PELSWIDTH | DM_PELSHEIGHT
              return ChangeDisplaySettings(ref dm, 0);
            }
          }
          '@
          try {
            Add-Type -TypeDefinition $source -ErrorAction Stop
            $result = [Display]::Set(1920, 1080)
            Write-Host "ChangeDisplaySettings returned $result (0 means it worked)"
          } catch {
            Write-Host "Could not resize the display: $_"
          }
          Add-Type -AssemblyName System.Windows.Forms
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host "Display is now $($bounds.Width)x$($bounds.Height)"

      - name: Run WebDriver smoke suite
        if: needs.changes.outputs.code == 'true'
        run: npm run e2e
      # Always, not only on failure: the suite now photographs what a feature
      # looks like, and the whole point of those is to be looked at while the
      # pull request is open rather than after something has broken.
      #
      # Still not committed to the repository. A binary that changes whenever
      # the UI does is the cost that got pixel baselines rejected in phase 27,
      # and it buys nothing here - nothing is compared to them.
      - name: Upload screenshots
        if: always() && needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: e2e/screenshots
          if-no-files-found: ignore
          # Review aid, not an archive. Actions storage is billed by
          # gigabyte-month, and a screenshot nobody looked at within a week is
          # a screenshot nobody will look at.
          retention-days: 7
      # And the same pictures *in* the pull request, because an artifact is a
      # zip nobody opens. See scripts/screenshots.mjs for why this needs a
      # branch of its own rather than an API call.
      - name: Show the screenshots in the pull request
        if: always() && github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/screenshots.mjs
