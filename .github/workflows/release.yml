name: Release

# Two steps, deliberately separated by a human gate.
#
# release-please reads the conventional-commit titles that land on main and
# maintains one open "release" pull request holding the version bump and the
# changelog. Nothing is published while that PR sits there. Merging it is what
# creates the tag and the GitHub release - which is the same review gate every
# other change goes through, rather than a tag appearing because someone wrote
# "feat:" in a commit message.
#
# Only then does the second job build the installers and attach them.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # v5's only breaking change is the Node 24 runtime, which is the point:
      # v4 targets Node 20, which GitHub is deprecating and currently
      # force-runs on 24 with a warning on every release run.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  installers:
    name: installers
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      # A real release build, not the `--debug --no-bundle` one the e2e job
      # makes: this is the artifact people install.
      # The signing key is what lets an installed copy trust an update. Without
      # it in the environment `createUpdaterArtifacts` produces no `.sig`
      # files, and every install then refuses the update - silently, from the
      # user's side - so the manifest step below checks rather than assumes.
      - name: Build installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      # `latest.json` is what an installed copy polls. Tauri does not write it -
      # it only produces the signed bundles - so it is assembled here. NSIS
      # rather than MSI because the updater replaces an installed app in place,
      # and NSIS is the bundle that does that without a UAC prompt per update.
      - name: Write the update manifest
        shell: bash
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          bundle=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
          signature="${bundle}.sig"
          # No signature means the signing secret is missing or wrong. Failing
          # here is the point: a release published without one looks complete
          # and can never be installed by anybody's updater.
          test -f "$signature" || {
            echo "no .sig beside $bundle - is TAURI_SIGNING_PRIVATE_KEY set?" >&2
            exit 1
          }
          version="${TAG#v}"
          cat > latest.json <<JSON
          {
            "version": "$version",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "$(cat "$signature")",
                "url": "https://github.com/$REPO/releases/download/$TAG/$(basename "$bundle")"
              }
            }
          }
          JSON
          cat latest.json

      # Attached to the release release-please just cut. Both bundles are
      # produced because tauri.conf.json lists both targets; NSIS is the
      # smaller download and MSI is what group policy and IT tooling expect.
      #
      # `--clobber` so re-running a failed job replaces the partial upload
      # rather than erroring on a name that already exists.
      - name: Attach installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          msi=(src-tauri/target/release/bundle/msi/*.msi)
          nsis=(src-tauri/target/release/bundle/nsis/*-setup.exe)
          # Fail loudly rather than publishing a release with nothing attached:
          # a glob that matched nothing expands to the literal pattern.
          for file in "${msi[@]}" "${nsis[@]}"; do
            test -f "$file" || { echo "missing bundle: $file" >&2; exit 1; }
          done
          gh release upload "$TAG" "${msi[@]}" "${nsis[@]}" latest.json --clobber
