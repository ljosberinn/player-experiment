name: Dependabot

# Merges Dependabot's pull requests once CI is green.
#
# `workflow_run` rather than `pull_request`, because a workflow triggered by
# Dependabot gets a read-only token - that is GitHub's rule, not a setting -
# and cannot merge anything. A `workflow_run` workflow runs from the default
# branch with the repository's own token, and can.
#
# It touches the branch in no other way. Phase 45 had it regenerate
# THIRD-PARTY-NOTICES.md and push, because the drift check on that file failed
# on every update by construction; the push then parked a `pull_request` run at
# `action_required`, which blocked the merge until somebody approved it by
# hand. Phase 46 stopped committing the file at all, so there is nothing to
# regenerate here and nothing to push.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

# One at a time: two of these merging at once is two pull requests both
# rewriting a lockfile, and the loser has to be rebased anyway.
concurrency:
  group: dependabot-land

jobs:
  land:
    name: land
    # `actor` and not just the branch name: anyone with push access can create
    # a branch called `dependabot/…`, and this workflow merges what it is
    # pointed at.
    if: >
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion == 'success'
      && startsWith(github.event.workflow_run.head_branch, 'dependabot/')
      && github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          # Found through the commit rather than the branch: a run whose branch
          # has moved on since is a run about a commit nobody is looking at,
          # and merging on its word would merge code that never ran.
          pr=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
            --jq '[.[] | select(.state == "open" and .head.sha == env.HEAD_SHA)] | .[0].number // empty')
          if [ -z "$pr" ]; then
            echo "No open pull request whose head is $HEAD_SHA."
            exit 0
          fi

          # A squash, and the branch goes with it - the repository does not
          # delete them itself.
          gh pr merge "$pr" --squash --delete-branch
