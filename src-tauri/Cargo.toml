[package]
name = "apex"
version = "0.8.0"
description = "Local music player"
authors = ["Gerrit Alex"]
edition = "2021"
license = "MIT"
# Never published to crates.io; the binary is distributed as an installer.
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "apex_lib"
# Desktop-only: the staticlib/cdylib targets the template ships are for mobile
# and only produce linker warnings here.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "12"
# `bundled` compiles SQLite itself: no system dependency, and FTS5 is on by
# default in the bundled build.
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
walkdir = "2"
rayon = "1"
lofty = "0.25"
sha2 = "0.11"
# last.fm signs every authenticated call with an md5 of the sorted parameters.
# Nothing else in the tree provides md5; same RustCrypto family and the same
# `digest` major as `sha2`, so it adds one crate and no second trait version.
md-5 = "0.11"
# Already in the tree through `tauri-plugin-updater`, so naming it here makes a
# transitive dependency direct rather than adding one. `blocking` is the whole
# reason it is listed: `lastfm::transport` is synchronous by design, so the
# scrobbler thread owns its own client instead of borrowing Tauri's runtime.
reqwest = { version = "0.13", features = ["blocking", "form"] }
# Cover decoding only, for the palette behind the window. Decoders for the two
# formats embedded artwork is actually in - the default feature set pulls in a
# dozen more, plus rayon and a TIFF stack, for covers nobody ships.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Output only: `playback` pulls cpal, `mp3` routes decoding through symphonia.
# The formats we do not ingest are left off so their decoders are not linked.
rodio = { version = "0.22", default-features = false, features = ["playback", "mp3"] }

# Test-only instrumentation. `tauri-plugin-wdio-webdriver` embeds a WebDriver
# HTTP server in the binary, so it must never reach a shipped build - hence
# optional deps behind a feature CI enables for the e2e build alone.
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-opener = "2.5.4"

[dev-dependencies]
tempfile = "3"
# The one test that opens a socket: `lastfm::transport` against a loopback
# server, so the only code in the product that talks HTTP is not the only code
# with no coverage. Binds an ephemeral port on 127.0.0.1; no egress, no
# credentials.
wiremock = "0.6"
# `wiremock`'s server is async, and the transport under test is not - so the
# test drives the client from `spawn_blocking` on a multi-thread runtime.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
