[package]
name = "player"
version = "0.1.0"
description = "Local music player"
authors = ["Gerrit Alex"]
edition = "2021"
# Local-only application, never published; also what lets cargo-deny skip the
# missing license field via `[licenses] private.ignore`.
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "player_lib"
# Desktop-only: the staticlib/cdylib targets the template ships are for mobile
# and only produce linker warnings here.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "11"
# `bundled` compiles SQLite itself: no system dependency, and FTS5 is on by
# default in the bundled build.
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
walkdir = "2"
rayon = "1"
lofty = "0.24"
sha2 = "0.10"

# Test-only instrumentation. `tauri-plugin-wdio-webdriver` embeds a WebDriver
# HTTP server in the binary, so it must never reach a shipped build - hence
# optional deps behind a feature CI enables for the e2e build alone.
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
